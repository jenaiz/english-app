server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers, so redirects keep the scheme and host of the proxy in front.
    absolute_redirect off;

    # API requests go to the Go backend on the same origin: no CORS needed.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Expression pages only exist prerendered: anything else under them is a real 404 (not the SPA
    # with a 200, which search engines would take for a page), shown by the SPA's "not found" page.
    location ~ ^/expresiones/(idioms|phrasal-verbs)/$ {
        return 301 /expresiones/$1;
    }
    location ~ ^/expresiones/(idioms|phrasal-verbs)/. {
        try_files $uri.html =404;
        error_page 404 /404.html;
    }
    location = /404.html {
        internal;
    }

    # Prerendered pages (/expresiones/idioms/break-the-ice → break-the-ice.html), then the SPA
    # fallback for client-side routes.
    location / {
        try_files $uri $uri.html /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
