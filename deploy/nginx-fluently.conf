# ----- Fluently (english-app) — fluently.bukios.com ---------------------------
# Reference copy of the vhost that serves Fluently (the fluently-web container).
# The live file is /opt/bukios/nginx/prod.conf on the VPS — this block is
# appended there AND must be committed in the bukios repo (nginx/prod.conf), or
# the next bukios deploy wipes it (prod.conf is bind-mounted read-only into
# the bukios-app-nginx-1 container).
#
# Why HTTPS even on a temporary subdomain: bukios.com sends
# `Strict-Transport-Security: ...; includeSubDomains`, so any browser that has
# visited bukios.com refuses plain http://fluently.bukios.com.
#
# TLS: same DNS-01 flow as bukios.com (zone on Hetzner DNS), auto-renewed by the
# host's certbot.timer:
#   sudo certbot certonly --authenticator dns-hetzner \
#     --dns-hetzner-credentials /etc/letsencrypt/hetzner.ini \
#     --dns-hetzner-propagation-seconds 60 \
#     --cert-name fluently.bukios.com -d fluently.bukios.com
#
# Temporary domain: see english-app deploy/README.md ("Cambiar de dominio").

# HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name fluently.bukios.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: reverse proxy to the fluently-web container (nginx serving the SPA and
# proxying /api/ to the Go backend on its private network).
server {
    listen 443 ssl;
    server_name fluently.bukios.com;

    ssl_certificate /etc/letsencrypt/live/fluently.bukios.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluently.bukios.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2M;

    # Resolve the upstream lazily via Docker DNS so nginx keeps starting even
    # if the fluently container is down.
    resolver 127.0.0.11 valid=30s;

    location / {
        set $fluently_upstream http://fluently-web:80;
        proxy_pass $fluently_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
