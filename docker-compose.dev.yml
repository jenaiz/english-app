# Development stack: source code mounted into the containers.
#   docker compose -f docker-compose.dev.yml up
# Frontend (Vite, hot reload): http://localhost:5173
# Backend changes: docker compose -f docker-compose.dev.yml restart backend
name: english-app-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-english}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-english}
      POSTGRES_DB: ${DB_NAME:-english_app}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: golang:1.26-alpine
    working_dir: /src
    command: go run ./cmd/server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-english}
      DB_PASSWORD: ${DB_PASSWORD:-english}
      DB_NAME: ${DB_NAME:-english_app}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      CONTENT_DIR: /src/data/levels
      # Dev-only "Laboratorio" unit with every exercise type. Never set in production.
      LAB_CONTENT_DIR: /src/data/lab
      # Dev-only Club activities (one of each type), always open.
      LAB_CLUB_DIR: /src/data/lab_club
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      # Links in emails open the Vite dev server.
      APP_URL: http://localhost:5173
      MAIL_FROM: ${MAIL_FROM:-Fluently <no-reply@bukios.com>}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://backend:8080
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      # Container-only node_modules so macOS binaries don't clash with Linux ones.
      - node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata-dev:
  gomod:
  gobuild:
  node_modules:
